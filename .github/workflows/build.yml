name: Build Mod

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 25 (Required for Loom)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.10.2'

      - name: Build with Gradle 8.10.2
        run: |
          BUILD_FILE=$(find . -name "build.gradle" -type f | head -n 1)
          if [ -z "$BUILD_FILE" ]; then
            echo "Error: build.gradle not found!"
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          cd "$PROJECT_DIR"
          
          gradle build --no-daemon

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trap-visuals-jar
          path: '**/build/libs/*.jar'
