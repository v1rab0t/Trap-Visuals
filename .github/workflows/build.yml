name: Build Mod

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build with Gradle 8.8
        run: |
          # Автоматически находим, где лежит build.gradle
          BUILD_FILE=$(find . -name "build.gradle" -type f | head -n 1)
          if [ -z "$BUILD_FILE" ]; then
            echo "Error: build.gradle not found!"
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "Project directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          # Принудительно настраиваем Gradle 8.8 (совместимый с Fabric Loom)
          mkdir -p gradle/wrapper
          cat << 'EOF' > gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.8-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          # Генерируем gradlew если его нет
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 8.8
          fi

          chmod +x gradlew
          ./gradlew build

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trap-visuals-jar
          path: '**/build/libs/*.jar'
